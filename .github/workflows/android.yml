name: android

# Builds the tasks.sh APK. The website is untouched by this: Pages keeps serving
# the repo root as it always has, and this workflow is the only thing that makes
# an installable Android app.
#
# Artefacts per run:
#   tasksh-debug    always. Throwaway signature: installs, but a NEW debug build
#                   will not update the previous one (different signature).
#   tasksh-release  only when KEYSTORE_BASE64 exists. Signed with your key, so it
#                   installs OVER the previous build and keeps the data.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    one line: base64 -w0 tasksh-release.keystore
#   KEYSTORE_PASSWORD  the store password
#   KEY_ALIAS          tasksh
#   KEY_PASSWORD       the key password

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Secrets are not readable inside every `if:` expression, so they are copied
    # into job-level env once and the conditions test the env instead.
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `tools` was removed from the SDK, and this action installs it by
      # default -- which is what killed the first runs:
      #   Warning: Failed to find package 'tools'  ->  sdkmanager exit 1
      # platform-tools is the only package we actually need here; the runner
      # image already carries the SDK, build-tools and platform 34.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: report sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: install
        run: npm ci

      # The same build the website runs, plus the app-only staging step.
      - name: build web assets
        run: |
          npm run build
          node scripts/build-app.mjs

      - name: sync android
        run: npx cap sync android

      - name: assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: tasksh-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: decode keystore
        if: env.KS_B64 != ''
        run: |
          # A secret pasted from a viewer often carries a newline or a trailing
          # space; both break base64 decoding. Strip all whitespace first, so a
          # wrapped copy still produces the right key.
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tasksh.keystore"
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/tasksh.keystore")"
          echo "KS=$RUNNER_TEMP/tasksh.keystore" >> "$GITHUB_ENV"

      - name: assemble release
        if: env.KS_B64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: upload release apk
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tasksh-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
