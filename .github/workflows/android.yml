name: android

# Builds the tasks.sh APK. The website is untouched by this: Pages keeps serving
# the repo root as it always has, and this workflow is the only thing that makes
# an installable Android app.
#
# Artefacts per run:
#   tasksh-debug    always. Throwaway signature: installs, but a NEW debug build
#                   will not update the previous one (different signature).
#   tasksh-release  only when KEYSTORE_BASE64 exists. Signed with your key, so it
#                   installs OVER the previous build and keeps the data.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    one line: base64 -w0 tasksh-release.keystore
#   KEYSTORE_PASSWORD  the store password
#   KEY_ALIAS          tasksh
#   KEY_PASSWORD       the key password

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: write   # v79: commit the APK + feed to Pages, and create releases

jobs:
  apk:
    runs-on: ubuntu-latest
    # Secrets are not readable inside every `if:` expression, so they are copied
    # into job-level env once and the conditions test the env instead.
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `tools` was removed from the SDK, and this action installs it by
      # default -- which is what killed the first runs:
      #   Warning: Failed to find package 'tools'  ->  sdkmanager exit 1
      # platform-tools is the only package we actually need here; the runner
      # image already carries the SDK, build-tools and platform 34.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: report sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: install
        run: npm ci

      # The same build the website runs, plus the app-only staging step.
      - name: build web assets
        run: |
          npm run build
          node scripts/build-app.mjs

      - name: sync android
        run: npx cap sync android

      - name: assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: tasksh-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: decode keystore
        if: env.KS_B64 != ''
        run: |
          # A secret pasted from a viewer often carries a newline or a trailing
          # space; both break base64 decoding. Strip all whitespace first, so a
          # wrapped copy still produces the right key.
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/tasksh.keystore"
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/tasksh.keystore")"
          echo "KS=$RUNNER_TEMP/tasksh.keystore" >> "$GITHUB_ENV"

      - name: assemble release
        if: env.KS_B64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: upload release apk
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: tasksh-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # v79: publish where he can actually find it.
      #
      # GitHub Releases  the APK and its notes, at a link that never expires.
      # the site         version.json (the feed the app polls) + bundle.js (the
      #                  app itself, 1.1 MB, replaceable from inside the app, so
      #                  most updates are a tap instead of a reinstall).
      - name: publish feed + bundle to pages
        if: env.KS_B64 != '' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" tasksh.apk
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*1000000+v[1]*1000+v[2]")
          APK_BYTES=$(wc -c < tasksh.apk | tr -d ' ')
          APK_SHA=$(sha256sum tasksh.apk | cut -d' ' -f1)
          BUNDLE_BYTES=$(wc -c < bundle.js | tr -d ' ')
          BUNDLE_SHA=$(sha256sum bundle.js | cut -d' ' -f1)
          echo "apk    $VERSION ($CODE): $APK_BYTES bytes, $APK_SHA"
          echo "bundle $VERSION: $BUNDLE_BYTES bytes, $BUNDLE_SHA"
          VERSION="$VERSION" CODE="$CODE" APK_BYTES="$APK_BYTES" APK_SHA="$APK_SHA" \
          BUNDLE_BYTES="$BUNDLE_BYTES" BUNDLE_SHA="$BUNDLE_SHA" node -e '
            const fs = require("fs");
            const base = "https://chandansharamcs.github.io/To-do_app/";
            fs.writeFileSync("version.json", JSON.stringify({
              version: process.env.VERSION,
              versionCode: Number(process.env.CODE),
              apk: base + "tasksh.apk",
              apkBytes: Number(process.env.APK_BYTES),
              apkSha256: process.env.APK_SHA,
              bundleUrl: base + "bundle.js",
              bundleVersion: process.env.VERSION,
              bundleBytes: Number(process.env.BUNDLE_BYTES),
              bundleSha256: process.env.BUNDLE_SHA,
              releases: "https://github.com/Chandansharamcs/To-do_app/releases/latest",
              builtAt: new Date().toISOString().slice(0, 10)
            }, null, 2) + "\n");
          '
          cat version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasksh.apk version.json
          git diff --cached --quiet || git commit -m "release: publish ${VERSION} APK + feed to the site"
          git pull --rebase || true
          git push

      # The APK on the Releases page, with the changelog section as notes: the
      # "somewhere I can find it later" half, and it needs no login to download.
      - name: publish github release
        if: env.KS_B64 != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ '' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="app-v${VERSION}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          V="$VERSION" node -e '
            const fs = require("fs");
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            const marks = ["**" + process.env.V + "**", "`" + process.env.V + "`", process.env.V];
            let i = -1;
            for (const m of marks) { const j = md.indexOf(m); if (j >= 0) { i = j; break; } }
            fs.writeFileSync("notes.md", i >= 0 ? md.slice(i, i + 4000) : "tasks.sh " + process.env.V);
          '
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#tasksh-${VERSION}.apk" --clobber
          else
            gh release create "$TAG" "$APK#tasksh-${VERSION}.apk" \
              --title "tasks.sh ${VERSION}" --notes-file notes.md
          fi
          gh release view "$TAG" --json url -q .url
